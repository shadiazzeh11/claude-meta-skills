name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v jq >/dev/null 2>&1 || brew install jq

      - name: Show tool versions
        run: |
          uname -a
          python --version
          python3 --version
          jq --version
          make --version

      - name: Plugin package regression
        run: make test-plugin

      - name: Marketplace package regression
        run: make test-marketplace

      - name: Release metadata regression
        run: make test-release

      - name: Validation harness lock regression
        run: make test-validation-lock

      - name: Validation harness behavior regression
        run: make test-validation-harness

      - name: Repository hygiene regression
        run: make test-repo-hygiene

      - name: Analyzer regression
        run: make test-analyzer

      - name: Installer lifecycle regression
        run: make test-installer

      - name: Validation harness
        run: |
          TEST_HOME="$(mktemp -d)"
          trap 'rm -rf "$TEST_HOME"' EXIT
          HOME="$TEST_HOME" make test

      - name: Stop-hook environment regression
        run: |
          TEST_HOME="$(mktemp -d)"
          trap 'rm -rf "$TEST_HOME"' EXIT
          HOME="$TEST_HOME" make test-stop-env
